<svg viewBox="0 0 1240 320" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4dd8"/>
      <stop offset="1" stop-color="#4dc9ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8b9c"/>
    </marker>
  </defs>

  <rect width="1240" height="320" fill="#0a0a10"/>

  <!-- Step boxes -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <!-- 1 Webcam -->
    <rect x="20" y="110" width="180" height="90" rx="14" fill="#15151f" stroke="#2a2a38" stroke-width="1.5"/>
    <text x="110" y="148" fill="#f2f1f7">Webcam</text>
    <text x="110" y="170" fill="#8b8b9c" font-size="11" font-weight="normal">live video feed</text>

    <!-- 2 MediaPipe -->
    <rect x="255" y="90" width="220" height="130" rx="14" fill="#15151f" stroke="#2a2a38" stroke-width="1.5"/>
    <text x="365" y="135" fill="#f2f1f7">MediaPipe</text>
    <text x="365" y="155" fill="#f2f1f7">Landmark Detection</text>
    <text x="365" y="177" fill="#8b8b9c" font-size="11" font-weight="normal">Face + Pose landmarks</text>
    <text x="365" y="193" fill="#8b8b9c" font-size="11" font-weight="normal">expression blendshapes</text>

    <!-- 3 Stats summary -->
    <rect x="530" y="90" width="200" height="130" rx="14" fill="#15151f" stroke="#2a2a38" stroke-width="1.5"/>
    <text x="630" y="135" fill="#f2f1f7">Stats Summary</text>
    <text x="630" y="160" fill="#8b8b9c" font-size="11" font-weight="normal">eyebrow asymmetry,</text>
    <text x="630" y="177" fill="#8b8b9c" font-size="11" font-weight="normal">elbow angle, shoulder</text>
    <text x="630" y="194" fill="#8b8b9c" font-size="11" font-weight="normal">tilt, escalation tier</text>

    <!-- 4 Groq LLM -->
    <rect x="780" y="90" width="200" height="130" rx="14" fill="#15151f" stroke="url(#grad)" stroke-width="2"/>
    <text x="880" y="135" fill="#f2f1f7">Groq LLM</text>
    <text x="880" y="157" fill="#8b8b9c" font-size="11" font-weight="normal">openai/gpt-oss-120b</text>
    <text x="880" y="177" fill="#8b8b9c" font-size="11" font-weight="normal">Gen-Z slang roast,</text>
    <text x="880" y="194" fill="#8b8b9c" font-size="11" font-weight="normal">tone scaled by tier</text>

    <!-- 5 Output -->
    <rect x="1030" y="90" width="190" height="130" rx="14" fill="#15151f" stroke="#2a2a38" stroke-width="1.5"/>
    <text x="1125" y="130" fill="#f2f1f7">Roast Card</text>
    <text x="1125" y="152" fill="#f2f1f7">+ IMOJI Sound</text>
    <text x="1125" y="177" fill="#8b8b9c" font-size="11" font-weight="normal">shown on screen,</text>
    <text x="1125" y="194" fill="#8b8b9c" font-size="11" font-weight="normal">random sfx plays</text>
  </g>

  <!-- Arrows -->
  <g stroke="#8b8b9c" stroke-width="2" marker-end="url(#arrow)">
    <line x1="200" y1="155" x2="248" y2="155"/>
    <line x1="475" y1="155" x2="523" y2="155"/>
    <line x1="730" y1="155" x2="773" y2="155"/>
    <line x1="980" y1="155" x2="1023" y2="155"/>
  </g>

  <!-- Loop-back arrow -->
  <path d="M 1125 220 C 1125 280 110 280 110 220" fill="none" stroke="#ff4dd8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="620" y="300" fill="#ff4dd8" font-size="12" text-anchor="middle" font-weight="bold">loops every ~7s, roast gets more savage the longer you stay in frame</text>
</svg>
